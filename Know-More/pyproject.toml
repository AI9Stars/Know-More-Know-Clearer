[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "knowmore"
version = "0.1.0"
description = "Meta-cognitive data construction for knowledge augmentation in LLMs"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "openai>=1.0",
    "numpy>=1.23",
    "PyYAML>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
knowmore = "knowmore.cli:main"

[tool.setuptools.packages.find]
include = ["knowmore*"]

[tool.ruff]
line-length = 110
